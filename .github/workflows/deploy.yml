# Deploy the runbun Worker to Cloudflare — a button, not a ceremony.
#
# Trigger it from the Actions tab (workflow_dispatch): deploying dev is a
# deliberate act, same doctrine as the preview gate. Two repository secrets
# make it go (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN   scoped token: Account → Workers Scripts: Edit
#   CLOUDFLARE_ACCOUNT_ID  dashboard sidebar, Account ID
#
# Optional third: SITE_AUTH_PASSWORD — if present, the run pushes it as the
# Worker's preview-gate secret so a fresh Worker is never 503 (nor public).
# The gate fails closed without it, so forgetting this is loud, not leaky.

name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install
      - run: npm run cf:build:exact
      - name: Prove the private run transaction inside workerd
        run: npm run test:worker-runtime
      - name: Push the preview-gate secret
        env:
          SITE_AUTH_PASSWORD: ${{ secrets.SITE_AUTH_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$SITE_AUTH_PASSWORD" ]; then
            echo "SITE_AUTH_PASSWORD is absent; preserving the existing Worker secret."
            exit 0
          fi
          printf '%s' "$SITE_AUTH_PASSWORD" | npx wrangler secret put SITE_AUTH_PASSWORD
        # (wrangler creates the Worker on first secret put if it is new)
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
