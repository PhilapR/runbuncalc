# This workflow will do an install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v2
      with:
        # Full history. tests/ledger.test.js asserts that every finding marked
        # fixed names a commit that is an ANCESTOR of HEAD, and the default
        # depth of 1 gives a checkout with no history to ask. The gate then
        # fails on all 39 fixed findings for a reason that has nothing to do
        # with the ledger.
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: Zarel/setup-node@patch-1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Install Chromium for browser tests
      run: npx playwright-core install --with-deps chromium
    - run: npm run test
      env:
        CI: true

  publish:
    if: ${{ github.repository == 'smogon/damage-calc' && github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v2
    - run: npm install
    - name: Build
      run: node build
    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v1
      with:
        # Upload entire repository
        path: 'dist'
    - uses: actions/configure-pages@v1
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v1
